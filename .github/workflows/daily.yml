name: daily-update
# 매일 06:00 KST(21:00 UTC): 패치노트 수집·요약 + 게임 정보 갱신 → 커밋 → GitHub Pages 배포
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'manual.json', 'pkc_overrides.json', 'pkc_items.json', 'games.json']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: .cache
          key: pokeapi-${{ github.run_id }}
          restore-keys: pokeapi-
      - name: update data
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: |
          node update.mjs || echo "update.mjs failed"
          node lol_build.mjs || echo "lol failed"
          node hs_build.mjs || echo "hs failed"
          node pkc_build.mjs || echo "pkc failed"
      - name: commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add site
          git diff --cached --quiet || git commit -m "data: daily update $(date -u +%F)"
          # 도는 동안 다른 커밋이 올라왔으면 받아서 위에 얹고 올림 (안 그러면 요약 결과가 버려짐)
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
      # 예전 주소(famire-games.github.io/patchnotes)는 새 주소로 넘기기만 함 (사이트는 Cloudflare Pages: patchworkgg.pages.dev)
      - name: redirect pages
        run: |
          mkdir -p _redirect
          for f in site/*.html; do n=$(basename "$f"); cat > "_redirect/$n" <<HTML
          <!doctype html><meta charset="utf-8"><title>Patchwork</title>
          <link rel="canonical" href="https://patchworkgg.pages.dev/$n">
          <meta http-equiv="refresh" content="0;url=https://patchworkgg.pages.dev/$n">
          <script>location.replace('https://patchworkgg.pages.dev/$n'+location.search+location.hash)</script>
          <a href="https://patchworkgg.pages.dev/$n">patchworkgg.pages.dev</a>
          HTML
          done
          cp _redirect/index.html _redirect/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _redirect
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
