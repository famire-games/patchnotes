<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>관리자 — Patchwork</title>
<script src="i18n.js"></script>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262a33;--tx:#e6e8ec;--mute:#8a909c;--acc:#5aa9ff;--down:#ef6b6b;--up:#4cc38a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,"Malgun Gothic",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}header{border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0;padding:14px 0}h1 a{color:inherit;text-decoration:none}h1 b{color:var(--acc)}
h2{font-size:17px;margin:26px 0 10px}.mute{color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.card p{margin:6px 0;white-space:pre-wrap;word-break:break-word}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btns button{border:1px solid var(--line);background:none;color:var(--tx);border-radius:8px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.btns .red{border-color:var(--down);color:var(--down)}
.flag{vertical-align:-2px;border-radius:2px;margin-right:4px}
</style>
</head>
<body>
<header><div class="wrap"><h1><a href="index.html"><b>Patch</b>work</a> · 관리자</h1></div></header>
<main class="wrap" id="main"><p class="mute">불러오는 중…</p></main>
<script>
// 관리자 전용: 신고 목록(같은 글 신고는 묶음) → 글 삭제 / 작성자 정지 / 신고 무시, 정지 계정 목록 → 해제
// 관리자인지는 Firebase 규칙이 판단 (아니면 목록을 못 읽음)
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let items=[];
fetch('data.json').then(r=>r.json()).then(d=>{items=d.items;window.NAMES=d.names||{}});
const PID=i=>String(i.gid||i.url).replace(/[\/.#$\[\]]/g,'_').slice(0,500);
const patchOf=pid=>items.find(i=>PID(i)===pid);
async function load(){
  const m=$('main');
  if(!window.FB){setTimeout(load,300);return}
  if(!FB.isAdmin()){m.innerHTML='<p class="mute">관리자 계정으로 로그인해야 볼 수 있습니다.</p>';return}
  let reps=[],bans=[];
  try{[reps,bans]=await Promise.all([FB.reports(),FB.bans()])}catch(e){m.innerHTML='<p class="mute">불러오지 못했습니다: '+esc(e.code||e.message)+'</p>';return}
  // 같은 글에 대한 신고 묶기
  const g=new Map();for(const r of reps){const k=r.pid+'~'+r.cid;if(!g.has(k))g.set(k,{pid:r.pid,cid:r.cid,ids:[]});g.get(k).ids.push(r.id)}
  const groups=[...g.values()].sort((a,b)=>b.ids.length-a.ids.length);
  for(const x of groups)x.c=await FB.getComment(x.pid,x.cid).catch(()=>null);
  m.innerHTML=`<h2>신고된 평가 (${groups.length})</h2>`+(groups.map((x,n)=>{const p=patchOf(x.pid),c=x.c;
    return `<div class="card"><div class="mute">${p?esc(p.game)+' · '+esc(p.title):esc(x.pid)} · 신고 ${x.ids.length}건</div>
    ${c?`<div><b>${FLAG(c.country)}${esc(c.name)}</b></div><p>${esc(c.text)}</p>`:'<p class="mute">(이미 지워진 평가)</p>'}
    <div class="btns">${c?`<button class="red" data-act="del" data-n="${n}">평가 삭제</button><button class="red" data-act="ban" data-n="${n}">작성자 정지 + 삭제</button>`:''}<button data-act="ok" data-n="${n}">신고 무시</button></div></div>`}).join('')||'<p class="mute">신고가 없습니다.</p>')
   +`<h2>정지된 계정 (${bans.length})</h2>`+(bans.map(b=>`<div class="card"><div class="mute">${esc(b.id)} · ${esc(b.why)} · ${b.ts?b.ts.toDate().toLocaleString('ko-KR'):''}</div><div class="btns"><button data-unban="${esc(b.id)}">정지 해제</button></div></div>`).join('')||'<p class="mute">없습니다.</p>');
  m.onclick=async e=>{
    const ub=e.target.closest('[data-unban]');if(ub){await FB.unban(ub.dataset.unban);load();return}
    const b=e.target.closest('[data-act]');if(!b)return;const x=groups[+b.dataset.n];b.disabled=true;
    try{
      if(b.dataset.act==='ban'&&x.c)await FB.ban(x.c.uid,'report '+x.pid);
      if(b.dataset.act!=='ok'&&x.c)await FB.delComment(x.pid,x.cid);
      for(const id of x.ids)await FB.delReport(id);
    }catch(er){alert('실패: '+(er.code||er.message))}
    load();
  };
}
window.onUserChange=()=>load();
</script>
<script type="module" src="fb.js"></script>
</body>
</html>
