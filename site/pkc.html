<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>포켓몬 챔피언스 정보 — 포켓몬·기술·특성·타입 상성</title>
<meta name="description" content="포켓몬 챔피언스에 나오는 포켓몬의 종족값, 특성, 배울 수 있는 기술과 타입 상성을 한국어로 정리했습니다.">
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262a33;--tx:#e6e8ec;--mute:#8a909c;--acc:#5aa9ff;--gold:#ffcc66}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,"Malgun Gothic",sans-serif}
header{position:sticky;top:0;background:#0f1115ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);z-index:2}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
h1{font-size:19px;margin:0}h1 a{color:var(--tx);text-decoration:none}h1 b{color:var(--acc)}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:none;border:1px solid var(--line);color:var(--mute);padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--acc);border-color:var(--acc);color:#071425;font-weight:600}
.bar{display:flex;gap:8px;padding:0 0 12px;flex-wrap:wrap}
input,select{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px 10px;font:inherit}input{flex:1;min-width:160px}
main{padding:16px 16px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:10px;text-align:center;cursor:pointer;padding:8px 6px;font-size:14px}
.cell:hover{border-color:var(--acc)}.cell img{width:96px;height:96px;object-fit:contain;display:block;margin:0 auto}
.cell small{display:block;color:var(--mute);font-size:11px}
.pic{border-radius:50%;margin:6px auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;text-shadow:0 1px 3px #0008;position:relative;flex:none}.pic i{position:absolute;right:-2px;bottom:-2px;font-style:normal;font-size:12px;background:#c06bff;border-radius:999px;padding:0 6px}
.ty{display:inline-block;border-radius:4px;padding:0 6px;font-size:12px;color:#fff;margin:1px;text-shadow:0 1px 1px #0006}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--bg)}td.n{text-align:right;white-space:nowrap}td.t{color:#cfd3da;font-size:13px}
.row{cursor:pointer}.row:hover{background:#ffffff08}
#dlg{position:fixed;inset:0;background:#000b;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:40px 12px;z-index:5}#dlg.open{display:flex}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:820px;width:100%;padding:18px;position:relative}
.x{position:absolute;right:10px;top:4px;background:none;border:0;color:var(--mute);font-size:28px;cursor:pointer}
.head{display:flex;gap:18px;flex-wrap:wrap}.head img{width:180px;height:180px;object-fit:contain}
.head h2{margin:0 0 4px}h3{font-size:14px;color:var(--acc);margin:16px 0 6px}
.stat{display:grid;grid-template-columns:70px 40px 1fr;gap:6px;align-items:center;font-size:13px}.stat .b{height:8px;border-radius:4px;background:var(--acc)}
.ab{margin:4px 0}.ab b{margin-right:6px}.ab small{color:var(--mute)}
.chart td,.chart th{text-align:center;padding:2px;font-size:12px;min-width:28px}.chart th.r{text-align:right;padding-right:6px}
.x2{background:#2f7d4a;color:#fff}.x05{background:#7d3a2f;color:#fff}.x0{background:#222;color:#888}
th.s{cursor:pointer;user-select:none;white-space:nowrap}th.s:hover{color:var(--tx)}th.s.on{color:var(--acc)}
.sortbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px;font-size:13px;color:var(--mute)}
.sortbar button{background:var(--card);border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:4px 12px;font:inherit;cursor:pointer}
.sortbar button.on{background:var(--acc);border-color:var(--acc);color:#071425;font-weight:600}
.mtog{background:var(--card);border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:4px 14px;font:inherit;cursor:pointer}.mtog.on{background:#c06bff;border-color:#c06bff;color:#fff;font-weight:600}
.icell img{width:48px;height:48px;image-rendering:pixelated}
.note{color:var(--mute);font-size:13px;margin:0 0 12px}
footer{color:var(--mute);font-size:12px;text-align:center;padding:20px}
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2407147539092560" crossorigin="anonymous"></script>
</head>
<body>
<header><div class="wrap">
 <div class="top"><h1><a href="index.html"><b>Patch</b>work</a> · 포켓몬 챔피언스</h1>
  <nav><button data-t="mons" class="on">포켓몬</button><button data-t="moves">기술</button><button data-t="abil">특성</button><button data-t="items">도구</button><button data-t="chart">타입 상성</button></nav></div>
 <div class="bar"><input id="q" placeholder="이름이나 효과 검색 (예: 리자몽, 순풍)"><select id="f"></select></div>
</div></header>
<main class="wrap" id="main">불러오는 중…</main>
<div id="dlg"><div class="panel"><button class="x" onclick="closeDlg()">×</button><div id="body"></div></div></div>
<footer class="wrap">포켓몬 챔피언스 도감·기술·도구 설명 데이터: PokeAPI. 챔피언스 도구 목록: Serebii. 게임 내 밸런스 조정(위력·명중·PP 변경)은 늦게 반영될 수 있으니 패치노트도 함께 확인하세요. 이 사이트는 The Pokémon Company·Nintendo 와 관련이 없으며, 포켓몬 및 관련 이미지는 각 권리자의 자산입니다.</footer>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TC={normal:'#9fa19f',fire:'#e62829',water:'#2980ef',electric:'#fac000',grass:'#3fa129',ice:'#3dcef3',fighting:'#ff8000',poison:'#9141cb',ground:'#915121',flying:'#81b9ef',psychic:'#ef4179',bug:'#91a119',rock:'#afa981',ghost:'#704170',dragon:'#5060e1',dark:'#624d4e',steel:'#60a1b8',fairy:'#ef70ef'};
const CLS={physical:'물리',special:'특수',status:'변화'};
let D,tab='mons';
let ms={k:'name',dir:1};          // 기술 정렬: 키, 1=오름차순 -1=내림차순
let megaOn=true;                   // 도구 탭: 메가스톤 보이기
const ty=t=>`<span class="ty" style="background:${TC[t]||'#666'}">${esc(D.types[t]?.ko||t)}</span>`;
const pic=(x,sz=80)=>x.types?`<div class="pic" style="width:${sz}px;height:${sz}px;font-size:${sz*.42}px;background:linear-gradient(135deg,${TC[x.types[0]]},${TC[x.types[1]||x.types[0]]})">${esc(x.name.replace(/^메가/,'')[0])}${x.mega?'<i>M</i>':''}</div>`:'';
const total=m=>Object.values(m.stats).reduce((a,b)=>a+b,0);
function filters(){
 const f=$('f');f.innerHTML='';
 if(tab==='mons'||tab==='moves'){f.add(new Option('모든 타입',''));Object.entries(D.types).forEach(([k,v])=>f.add(new Option(v.ko,k)))}
 else f.add(new Option('전체',''));
 if(tab==='mons')f.add(new Option('메가진화만','mega'));
 if(tab==='moves')['physical','special','status'].forEach(c=>f.add(new Option(CLS[c]+' 기술','c:'+c)));
 if(tab==='items'){f.innerHTML='';f.add(new Option('모든 도구',''));f.add(new Option('지닌 도구','held'));f.add(new Option('나무열매','berry'))}
 f.style.display=tab==='chart'?'none':'';$('q').style.display=tab==='chart'?'none':'';
}
function render(){
 const q=$('q').value.trim(),f=$('f').value,m=$('main');
 if(tab==='mons'){
  const l=D.mons.filter(x=>(!q||x.name.includes(q)||x.abilities.some(a=>D.abilities[a.id]?.name.includes(q)))&&(!f||(f==='mega'?x.mega:x.types.includes(f))));
  m.innerHTML=`<p class="note">포켓몬 챔피언스에 나오는 포켓몬 ${D.mons.filter(x=>!x.mega).length}마리 + 메가진화 ${D.mons.filter(x=>x.mega).length}종</p><div class="grid">`+
   l.map(x=>`<div class="cell" data-k="mon" data-id="${x.id}">${pic(x)}${esc(x.name)}<small>${x.types.map(ty).join('')}</small><small>종족값 합계 ${total(x)}</small></div>`).join('')+'</div>'||'<p>결과 없음</p>';
 }else if(tab==='moves'){
  const KEY={name:x=>x.name,type:x=>D.types[x.type]?.ko||x.type,cls:x=>CLS[x.cls],power:x=>x.power,acc:x=>x.acc,pp:x=>x.pp,pri:x=>x.pri};
  const l=Object.entries(D.moves).filter(([k,x])=>(!q||x.name.includes(q)||x.text.includes(q))&&(!f||(f.startsWith('c:')?x.cls===f.slice(2):x.type===f)));
  const kf=KEY[ms.k];
  l.sort((a,b)=>{let va=kf(a[1]),vb=kf(b[1]);
   if(va==null&&vb==null)return a[1].name.localeCompare(b[1].name,'ko');
   if(va==null)return 1;if(vb==null)return -1;            // 위력·명중 없는 기술(—)은 항상 맨 뒤
   const c=typeof va==='string'?va.localeCompare(vb,'ko'):va-vb;
   return c*ms.dir||a[1].name.localeCompare(b[1].name,'ko')});
  const SB=[['power','위력'],['acc','명중'],['pp','PP'],['pri','우선도'],['name','이름']];
  const arrow=k=>ms.k===k?(ms.dir>0?' ▲':' ▼'):'';
  const th=(k,t)=>`<th class="s${ms.k===k?' on':''}" data-sort="${k}">${t}${arrow(k)}</th>`;
  m.innerHTML=`<div class="sortbar">정렬: ${SB.map(([k,t])=>`<button data-sort="${k}" class="${ms.k===k?'on':''}">${t}${arrow(k)}</button>`).join('')}
   <span>· 같은 버튼을 다시 누르면 오름차순/내림차순이 바뀝니다 · 기술 ${l.length}개</span></div>
   <table><tr>${th('name','기술')}${th('type','타입')}${th('cls','분류')}${th('power','위력')}${th('acc','명중')}${th('pp','PP')}<th>효과</th></tr>`+
   l.map(([k,x])=>`<tr class="row" data-k="move" data-id="${k}"><td><b>${esc(x.name)}</b>${x.pri?` <small>(우선도 ${x.pri>0?'+':''}${x.pri})</small>`:''}</td><td>${ty(x.type)}</td><td>${CLS[x.cls]}</td><td class="n">${x.power??'—'}</td><td class="n">${x.acc??'—'}</td><td class="n">${x.pp}${x.patched?` <small title="챔피언스 ${x.patched} 패치로 조정됨" style="color:#ffcc66">조정</small>`:''}</td><td class="t">${esc(x.text)}</td></tr>`).join('')+'</table>';
 }else if(tab==='abil'){
  const l=Object.entries(D.abilities).filter(([k,x])=>!q||x.name.includes(q)||x.text.includes(q)).sort((a,b)=>a[1].name.localeCompare(b[1].name,'ko'));
  m.innerHTML=`<p class="note">특성 ${l.length}개 · 줄을 누르면 가진 포켓몬</p><table><tr><th>특성</th><th>효과</th></tr>`+
   l.map(([k,x])=>`<tr class="row" data-k="abil" data-id="${k}"><td style="white-space:nowrap"><b>${esc(x.name)}</b></td><td class="t">${esc(x.text)}</td></tr>`).join('')+'</table>';
 }else if(tab==='items'){
  const l=D.items.filter(x=>(megaOn||x.kind!=='mega')&&(!f||x.kind===f)&&(!q||x.name.includes(q)||x.text.includes(q)||x.en.toLowerCase().includes(q.toLowerCase())));
  const KN={mega:'메가스톤',held:'지닌 도구',berry:'나무열매'};
  const grp=['held','berry','mega'].filter(k=>(megaOn||k!=='mega')&&(!f||f===k));
  m.innerHTML=`<div class="sortbar"><button class="mtog${megaOn?' on':''}" id="megaTog">메가스톤 ${megaOn?'ON':'OFF'}</button><span>· 챔피언스에서 지닐 수 있는 도구 ${l.length}개</span></div>`+
   grp.map(k=>{const a=l.filter(x=>x.kind===k);return a.length?`<h3>${KN[k]} (${a.length})</h3><table>`+a.map(x=>{const mon=x.mega&&D.mons.find(y=>y.id===x.mega);
    return `<tr${mon?` class="row" data-k="mon" data-id="${mon.id}"`:''}><td class="icell" style="width:56px">${x.img?`${pic(x)}`:''}</td><td style="white-space:nowrap"><b>${esc(x.name)}</b>${x.name!==x.en?`<br><small style="color:var(--mute)">${esc(x.en)}</small>`:''}</td><td class="t">${esc(x.text)||'—'}${mon?` <br><small style="color:#c06bff">→ ${esc(mon.name)} (누르면 정보)</small>`:''}</td></tr>`}).join('')+'</table>':''}).join('')||'<p>결과 없음</p>';
 }else{
  const T=Object.keys(D.types);
  const eff=(a,d)=>D.types[a].none.includes(d)?0:D.types[a].double.includes(d)?2:D.types[a].half.includes(d)?.5:1;
  m.innerHTML='<p class="note">세로 = 공격 기술 타입, 가로 = 받는 포켓몬 타입. 초록 2배 · 빨강 0.5배 · 검정 효과 없음</p><div style="overflow:auto"><table class="chart"><tr><th></th>'+T.map(d=>`<th>${ty(d)}</th>`).join('')+'</tr>'+
   T.map(a=>`<tr><th class="r">${ty(a)}</th>`+T.map(d=>{const e=eff(a,d);return `<td class="${e===2?'x2':e===.5?'x05':e===0?'x0':''}">${e===1?'':e===.5?'½':e}</td>`}).join('')+'</tr>').join('')+'</table></div>';
 }
}
function monList(arr){return '<div class="grid">'+arr.map(x=>`<div class="cell" data-k="mon" data-id="${x.id}">${pic(x)}${esc(x.name)}<small>${x.types.map(ty).join('')}</small></div>`).join('')+'</div>'}
function open(k,id){
 let h='';
 if(k==='mon'){
  const x=D.mons.find(y=>y.id==id),mx=Math.max(...Object.values(x.stats),150);
  const mv=x.moves.map(n=>[n,D.moves[n]]).filter(a=>a[1]).sort((a,b)=>a[1].name.localeCompare(b[1].name,'ko'));
  h=`<div class="head">${pic(x,150)}<div style="flex:1;min-width:240px"><h2>${esc(x.name)} <small style="color:var(--mute)">No.${x.dex}</small></h2>${x.types.map(ty).join('')}
   <h3>종족값 (합계 ${total(x)})</h3>${Object.entries(x.stats).map(([s,v])=>`<div class="stat"><span>${D.stat[s]}</span><b>${v}</b><div class="b" style="width:${v/mx*100}%"></div></div>`).join('')}
   ${x.mega&&D.items.find(i=>i.mega===x.id)?`<h3>필요한 메가스톤</h3><div class="ab"><b>${esc(D.items.find(i=>i.mega===x.id).name)}</b></div>`:''}<h3>특성</h3>${x.abilities.map(a=>`<div class="ab"><b>${esc(D.abilities[a.id]?.name||a.id)}</b>${a.hidden?'<small>(숨겨진 특성)</small>':''}<div class="t" style="color:#cfd3da;font-size:13px">${esc(D.abilities[a.id]?.text||'')}</div></div>`).join('')}</div></div>
   <h3>배울 수 있는 기술 (${mv.length})</h3><table><tr><th>기술</th><th>타입</th><th>분류</th><th>위력</th><th>명중</th><th>PP</th></tr>${mv.map(([n,m])=>`<tr><td>${esc(m.name)}</td><td>${ty(m.type)}</td><td>${CLS[m.cls]}</td><td class="n">${m.power??'—'}</td><td class="n">${m.acc??'—'}</td><td class="n">${m.pp}</td></tr>`).join('')}</table>`;
 }else if(k==='move'){
  const m=D.moves[id];
  h=`<h2>${esc(m.name)}</h2>${ty(m.type)} <span class="ty" style="background:#444">${CLS[m.cls]}</span><p>위력 ${m.power??'—'} · 명중 ${m.acc??'—'} · PP ${m.pp}${m.pri?' · 우선도 '+m.pri:''}</p><p class="t">${esc(m.text)}</p><h3>배우는 포켓몬</h3>${monList(D.mons.filter(x=>x.moves.includes(id)))}`;
 }else{
  const a=D.abilities[id];
  h=`<h2>${esc(a.name)}</h2><p class="t">${esc(a.text)}</p><h3>이 특성을 가진 포켓몬</h3>${monList(D.mons.filter(x=>x.abilities.some(y=>y.id===id)))}`;
 }
 $('body').innerHTML=h;$('dlg').classList.add('open');$('dlg').scrollTop=0;
}
function closeDlg(){$('dlg').classList.remove('open')}
$('dlg').onclick=e=>{if(e.target.id==='dlg')closeDlg()};
addEventListener('keydown',e=>{if(e.key==='Escape')closeDlg()});
document.addEventListener('click',e=>{
 const so=e.target.closest('[data-sort]');if(so){const k=so.dataset.sort;if(ms.k===k)ms.dir=-ms.dir;else{ms.k=k;ms.dir=['power','acc','pp','pri'].includes(k)?-1:1}render();return}
 if(e.target.closest('#megaTog')){megaOn=!megaOn;render();return}
const d=e.target.closest('[data-k]');if(d&&(d.closest('#main')||d.closest('#body')))open(d.dataset.k,d.dataset.id)});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));tab=b.dataset.t;$('q').value='';filters();render()});
$('q').oninput=render;$('f').onchange=render;
fetch('pkc/data.json').then(r=>r.json()).then(d=>{D=d;filters();render()});
</script>
<script src="i18n.js"></script>
<script src="nav.js"></script>
<script src="foot.js"></script>
</body>
</html>
