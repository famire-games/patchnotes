<h1>中世纪王朝 2.7.0.3 更新补丁</h1>
<p>《中世纪王朝》现已在公共分支发布 2.7.0.3 更新，解决了近期发布版本相关的一些问题并包含其他调整。</p><h2 class="">主要改动</h2><ul><li>添加了传奇鸽子矛配方</li><li>移除了铁矛配方</li><li>移除了传奇鸽子奖杯</li><li>商人不再出售复活节彩蛋</li><li>删除或更改传奇动物装饰时会返还奖杯至物品栏</li></ul><h2 class="">错误修复</h2><ul><li>解决了与近期发布相关的一些问题</li></ul>
