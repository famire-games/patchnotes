<h1>3.26.3.16 パッチノート</h1>
<p>今回のパッチには、サーバー管理に関する軽微な変更が主に含まれています。見知らぬ人からのサーバー招待や、信頼できないサーバーへの参加には十分注意してください。今年初めには、悪意のあるワークショップコンテンツに関する報告が増加しています。</p><h2 class="">主な変更</h2><ul><li>サーバー管理に関する軽微な変更の適用</li><li>悪意のあるワークショップコンテンツに対する注意喚起</li></ul>
