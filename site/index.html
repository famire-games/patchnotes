<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>패치노트 모음 — 게임 업데이트 한국어 요약</title>
<meta name="description" content="스팀 인기 게임 패치노트를 한국어로 요약하고 상향·하향·버그 수정을 한눈에 정리합니다.">
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262a33;--tx:#e6e8ec;--mute:#8a909c;--acc:#5aa9ff;--up:#4cc38a;--down:#ef6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,"Malgun Gothic",sans-serif}
header{position:sticky;top:0;background:#0f1115ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);z-index:2}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px;padding:14px 0;flex-wrap:wrap}
h1{font-size:20px;margin:0}h1 b{color:var(--acc)}
.top small{color:var(--mute)}
.bar{display:flex;gap:8px;padding:0 0 12px;flex-wrap:wrap}
input,select{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px 10px;font:inherit}
input{flex:1;min-width:180px;max-width:520px}#day{flex:none;min-width:0;color-scheme:dark;cursor:pointer;user-select:none;caret-color:transparent}#day::-webkit-datetime-edit-year-field:focus,#day::-webkit-datetime-edit-month-field:focus,#day::-webkit-datetime-edit-day-field:focus{background:transparent;color:inherit}
.tog{background:var(--card);border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}.tog.on{background:#ffcc33;border-color:#ffcc33;color:#1a1406;font-weight:600}
.info{position:relative;margin-left:auto}#infoBtn{background:var(--acc);color:#071425;border:0;border-radius:8px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer;height:100%}
.pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:240px;display:none;z-index:4;box-shadow:0 8px 24px #0008}.pop.open{display:block}
.pop a{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;color:var(--tx);text-decoration:none}.pop a:hover{background:#ffffff10}.pop img{width:64px;height:30px;object-fit:cover;border-radius:4px}
main{padding:18px 16px 60px}
.day{margin:0 0 26px}.day h2{font-size:15px;color:var(--mute);margin:0 0 10px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--acc)}
.tile .ic{aspect-ratio:460/215;background:#0b0d11 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff;text-align:center;padding:10px;letter-spacing:-.5px}
.tile .ic.txt{background:#000;border-bottom:1px solid #222;word-break:keep-all;line-height:1.25}
.tile .nm{padding:8px 10px 0;font-weight:600;font-size:14px}
.tile .tt{padding:0 10px 10px;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.meta{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:13px}
.game{color:var(--acc);font-weight:600}
.card h2{font-size:18px;margin:6px 0}
.sum{margin:0 0 10px;color:#cfd3da}
ul{margin:4px 0 8px;padding-left:20px}
.tags{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{border-radius:8px;padding:8px 12px;background:#12151b}
.box h3{font-size:13px;margin:0 0 2px}
.up h3{color:var(--up)}.down h3{color:var(--down)}
details summary{cursor:pointer;color:var(--mute);font-size:13px;margin-top:6px}
a{color:var(--acc)}
.foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}.foot .src{margin:0;flex:1}.allp{background:var(--acc);color:#071425;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.src{font-size:13px;margin-top:8px}
#dlg{position:fixed;inset:0;background:#000b;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:40px 12px;z-index:7}
#dlg.open{display:flex}
#dlg .card{max-width:820px;width:100%;position:relative}
#dlg .hero{width:100%;border-radius:8px;margin-bottom:10px;display:block}
#dlg .x{position:absolute;right:10px;top:4px;background:none;border:0;color:var(--mute);font-size:28px;cursor:pointer}
.iconbtn{background:none;border:0;color:var(--tx);cursor:pointer;padding:4px;border-radius:8px;display:flex}.iconbtn:hover{background:#ffffff12}
.login{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--tx);background:none;cursor:pointer;display:flex;gap:6px;align-items:center}
#drawer{position:fixed;top:0;left:0;bottom:0;width:270px;background:#12151b;border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .18s;z-index:6;padding:16px;overflow:auto}
#drawer.open{transform:none}#shade{position:fixed;inset:0;background:#0007;display:none;z-index:5}#shade.open{display:block}
#drawer h3.link{cursor:pointer}#drawer h3.link:hover{color:var(--acc)}
#drawer h3{margin:4px 0 10px;font-size:15px;display:flex;align-items:center;gap:6px}#drawer .who{color:var(--mute);font-size:13px;margin-bottom:14px}
.fav{display:flex;align-items:center;gap:8px;padding:6px;border-radius:8px;cursor:pointer}.fav:hover{background:#ffffff0d}
.fav img{width:64px;border-radius:4px}.fav span{flex:1;font-size:14px}.fav .rm{color:var(--mute);background:none;border:0;cursor:pointer;font-size:16px}
.chk{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:14px;cursor:pointer;margin:0 0 12px}
.star{width:auto!important;padding:0 14px;font-size:15px!important;font-weight:600;position:absolute;left:28px;top:26px;background:#000a;border:0;border-radius:999px;width:42px;height:42px;font-size:24px;cursor:pointer;color:#fff;line-height:1}
.star.on{color:#ffcc33}
.txtban{aspect-ratio:460/160;background:#000;border:1px solid #222;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:800;letter-spacing:-1px}
.tile{position:relative}.tile .fs{position:absolute;left:6px;top:6px;color:#ffcc33;font-size:18px;text-shadow:0 0 4px #000}
.ad{position:fixed;top:140px;width:160px;height:600px;border:1px dashed #3a3f4a;color:#555b66;display:none;align-items:center;justify-content:center;font-size:12px;border-radius:6px}
.ad.l{left:calc(50% - 540px - 190px)}.ad.r{right:calc(50% - 540px - 190px)}
@media(min-width:1460px){.ad{display:flex}}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding-top:12px}.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:#1d2633;border:1px solid #2d4260;color:#cfe3ff;border-radius:999px;padding:3px 6px 3px 12px;font-size:13px}
.chip button{background:none;border:0;color:#9fb6d6;cursor:pointer;font-size:14px;padding:0 4px}.chip button:hover{color:#fff}
.chip.reset{background:none;border-color:var(--line);color:var(--mute);padding:3px 12px;cursor:pointer}
footer{color:var(--mute);font-size:12px;text-align:center;padding:20px}
@media(max-width:600px){.tags{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}}
.cm{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}.cm h3{margin:0 0 10px;font-size:16px}
.rate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.rate .avg{font-size:22px;font-weight:700;color:#ffcc33}.rate small{color:var(--mute)}
.stars button{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:#3a3f4a;padding:0 2px}.stars button.on{color:#ffcc33}.stars button:hover{transform:scale(1.15)}
.cmf{display:flex;gap:8px;margin-bottom:12px}.cmf textarea{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px 10px;font:inherit;resize:vertical;min-height:44px}
.cmf button,.cmsort button{background:var(--acc);color:#071425;border:0;border-radius:8px;padding:0 16px;font:inherit;font-weight:600;cursor:pointer}
.cmsort{display:flex;gap:6px;margin-bottom:8px}.cmsort button{background:none;color:var(--mute);border:1px solid var(--line);padding:3px 10px;font-weight:400;font-size:13px}.cmsort button.on{color:var(--tx);border-color:var(--acc)}
.cmi{padding:10px 0;border-bottom:1px solid var(--line)}.cmi .h{font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center}.cmi .h b{color:var(--tx)}.cmi .h .st{color:#ffcc33}
.cmi p{margin:4px 0 6px;white-space:pre-wrap;word-break:break-word}.cmi .v{display:flex;gap:6px}.cmi .v button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:1px 10px;font:inherit;font-size:13px;cursor:pointer}
.cmi .v button.on.u{color:var(--up);border-color:var(--up)}.cmi .v button.on.d{color:var(--down);border-color:var(--down)}.cmi .del{margin-left:auto;background:none;border:0;color:var(--mute);cursor:pointer;font-size:12px}
</style>
</head>
<body>
<header><div class="wrap">
 <div class="top"><button class="iconbtn" id="menu" title="메뉴"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><h1><a href="index.html" style="color:inherit;text-decoration:none"><b>패치</b>노트 모음</a></h1><small id="upd"></small><button class="login" style="margin-left:auto" id="login"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span id="loginTxt">로그인</span></button></div>
 <div class="bar"><input id="q" placeholder="게임 이름이나 내용 검색 (예: 크립토, 버그)"><input type="date" id="day" title="날짜 찾기"><button id="favTog" type="button" class="tog" title="즐겨찾기한 게임만 보기">☆ 즐겨찾기</button><div class="info"><button id="infoBtn" type="button" hidden>게임 정보 보기</button></div><select id="g" hidden><option value="">모든 게임</option></select></div>
</div></header>
<div id="shade"></div>
<aside id="drawer"><h3>☰ 메뉴</h3><div class="who" id="who"></div>
 <input type="checkbox" id="onlyFav" hidden>
 <h3 id="favHead" class="link" title="즐겨찾기한 게임 패치만 보기">★ 즐겨찾기 목록</h3><div id="favs"></div></aside>
<div class="ad l">광고</div><div class="ad r">광고</div>
<div class="wrap chips" id="chips"></div>
<main class="wrap" id="list"></main>
<div id="dlg"><div class="card" id="body"></div></div>
<footer class="wrap">각 요약은 공식 스팀 공지·게임사 공식 패치노트를 AI 로 한국어 요약한 것입니다. 정확한 내용은 원문을 확인하세요. 게임 이미지는 각 게임사의 자산입니다.</footer>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const li=a=>a&&a.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'';
let ICONS={};
// 간판: 스팀 게임은 스팀 공식 헤더(460×215) 하나로 통일, 롤은 스플래시, 나머지는 검은 글자 간판
const ICON=i=>ICONS[i.appid]||(i.appid==='lol'?'https://ddragon.leagueoflegends.com/cdn/img/champion/splash/Ahri_0.jpg':'');
const dayKey=t=>new Date(t*1000).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
let items=[],shown=[];
// 로그인·즐겨찾기 (지금은 이 브라우저에만 저장. 실제 계정 로그인은 서버 연결 후 교체)
// 로그인 = Firebase 구글 로그인, 즐겨찾기 = Firestore users/{uid}.favs (아래 module 스크립트가 window.FB 제공)
let user=null,favs=new Set();
const saveFavs=()=>{ if(user&&window.FB) FB.saveFavs([...favs]).catch(e=>console.error('즐겨찾기 저장 실패',e)) };
window.onUserChange=(u,list)=>{ user=u?{name:u.displayName||u.email||'사용자'}:null; favs=new Set(list||[]); if(items.length){drawUser(); render();} if(cur)drawCm(); };
function toggleFav(game){ if(!user){alertLogin();return false} favs.has(game)?favs.delete(game):favs.add(game); saveFavs(); drawUser(); render(); return true }
function alertLogin(){ $('who').innerHTML='즐겨찾기는 <b>로그인</b> 후 쓸 수 있습니다.'; openDrawer() }
function setGame(n){if(n&&![...$('g').options].some(o=>o.value===n))$('g').add(new Option(n,n));$('g').value=n||''}
function fillGames(){
 const sel=$('g'),cur=sel.value,useFav=user&&favs.size;
 const names=useFav?[...favs].sort():[...new Set(items.map(i=>i.game))].sort();
 sel.innerHTML='';sel.add(new Option('모든 게임',''));
 names.forEach(n=>sel.add(new Option(n,n)));setGame(cur);
}
function drawUser(){fillGames();
 $('loginTxt').textContent=user?user.name:'로그인';
 $('who').innerHTML=user?esc(user.name)+' 님 · <a href="#" id="logout">로그아웃</a>':'로그인하면 즐겨찾기를 쓸 수 있습니다.';
 const lo=$('logout'); if(lo) lo.onclick=e=>{e.preventDefault();window.FB&&FB.logout()};
 const g=[...favs].sort();
 $('favs').innerHTML=!user?'':g.length?g.map(n=>{const it=items.find(i=>i.game===n)||{};return `<div class="fav" data-g="${esc(n)}">${ICON(it)?`<img src="${ICON(it)}" alt="">`:''}<span>${esc(n)}</span><button class="rm" data-rm="${esc(n)}" title="빼기">✕</button></div>`}).join(''):'<small style="color:var(--mute)">패치 창의 [☆ 게임 즐겨찾기] 로 추가하세요.</small>';
}
function openDrawer(){$('drawer').classList.add('open');$('shade').classList.add('open')}
function closeDrawer(){$('drawer').classList.remove('open');$('shade').classList.remove('open')}
function detail(i){
 const url=typeof i.appid==='string'?i.url:`https://store.steampowered.com/news/app/${i.appid}/view/${i.gid}`;
 const bal=(i.buffs.length||i.nerfs.length)?`<div class="tags"><div class="box up"><h3>▲ 상향</h3>${li(i.buffs)||'<small>없음</small>'}</div><div class="box down"><h3>▼ 하향</h3>${li(i.nerfs)||'<small>없음</small>'}</div></div>`:'';
 return `<button class="x" onclick="closeDlg()">×</button>${ICON(i)?`<img class="hero" src="${ICON(i)}" alt="">`:`<div class="hero txtban">${esc(i.game)}</div>`}<button class="star${favs.has(i.game)&&user?' on':''}" data-fav="${esc(i.game)}" title="이 게임을 즐겨찾기">${favs.has(i.game)&&user?'★ 즐겨찾는 게임':'☆ 게임 즐겨찾기'}</button>
  <div class="meta"><span class="game">${esc(i.game)}</span>·<span>${new Date(i.date*1000).toLocaleDateString('ko-KR')}</span></div>
  <h2>${esc(i.title)}</h2><p class="sum">${esc(i.summary)}</p>${li(i.highlights)}${bal}
  ${i.fixes.length?`<details><summary>버그 수정 ${i.fixes.length}건</summary>${li(i.fixes)}</details>`:''}
  <div class="foot"><div class="src">원문: <a href="${url}" target="_blank" rel="noopener">${esc(i.origTitle)}</a></div><button class="allp" data-all="${esc(i.game)}">${esc(i.game)} 모든 패치 보기 →</button></div>
  <div class="cm" id="cm"><small style="color:var(--mute)">평점·댓글 불러오는 중…</small></div>`;
}
// 게임 정보 페이지가 있는 게임: 그 게임 패치만 볼 때 [게임 정보 보기] 버튼이 나타남
const INFO={"리그 오브 레전드":"lol.html","전략적 팀 전투":"","포켓몬 챔피언스":"pkc.html","하스스톤":"","하스스톤 (전장)":"hs.html"};
function syncTog(){const on=$("onlyFav").checked;$("favTog").classList.toggle("on",on);$("favTog").textContent=(on?"★":"☆")+" 즐겨찾기"}
function chips(){
 const c=[],g=$('g').value,dv=$('day').value,q=$('q').value.trim();
 if(g)c.push(['g',esc(g)+' 패치']);
 if($('onlyFav').checked&&user)c.push(['fav','★ 즐겨찾기한 게임']);
 if(dv)c.push(['day',dv.replace(/-/g,'. ')+'.']);
 if(q)c.push(['q','검색: '+esc(q)]);
 $('chips').innerHTML=c.map(([k,t])=>`<span class="chip">${t}<button data-clr="${k}" title="풀기">✕</button></span>`).join('')+(c.length>1?'<button class="chip reset" data-clr="all">모두 풀기</button>':'');
}
function clearF(k){
 if(k==='g'||k==='all')$('g').value='';
 if(k==='fav'||k==='all')$('onlyFav').checked=false;
 if(k==='day'||k==='all')$('day').value='';
 if(k==='q'||k==='all')$('q').value='';
 render();
}
let limit=60,io=null;
function render(more){
 if(more!==true)limit=60;
 syncTog();chips();
 $("infoBtn").hidden=!$("g").value;
 const q=$('q').value.trim().toLowerCase(),g=$('g').value;
 const of=$('onlyFav').checked&&user;
 const dv=$('day').value;
 // 검색용 글자는 한 번만 만들어 둠 (매번 JSON 전체를 문자열로 만들면 느림)
 shown=items.filter(i=>(!dv||i._d===dv)&&(!g||i.game===g)&&(!of||favs.has(i.game))&&(!q||i._s.includes(q)));
 const part=shown.slice(0,limit),days=new Map();
 part.forEach((i,n)=>{const k=dayKey(i.date);if(!days.has(k))days.set(k,[]);days.get(k).push([i,n])});
 $('list').innerHTML=[...days].map(([d,a])=>{const cnt=shown.filter(i=>i._k===d).length;
  return `<section class="day"><h2>${d} · ${cnt}건</h2><div class="tiles">`+a.map(([i,n])=>`<div class="tile" data-i="${n}">${favs.has(i.game)&&user?'<span class="fs">★</span>':''}
   <div class="ic${ICON(i)?'':' txt'}" style="${ICON(i)?`background-image:url('${ICON(i)}')`:''}">${ICON(i)?'':esc(i.game)}</div>
   <div class="nm">${esc(i.game)}</div><div class="tt">${esc(i.title)}</div></div>`).join('')+'</div></section>'}).join('')+(shown.length>limit?'<div id="more" style="height:40px"></div>':'')||'<p>결과가 없습니다.</p>';
 // 아래로 내리면 60개씩 더 그림
 if(io)io.disconnect();
 const m=$('more');if(m){io=new IntersectionObserver(e=>{if(e[0].isIntersecting){limit+=60;render(true)}},{rootMargin:'600px'});io.observe(m)}
}
function closeDlg(){$('dlg').classList.remove('open');cur=null}
// ===== 커뮤니티: 별점 + 댓글(좋아요/싫어요) — Firestore patches/{pid} =====
let cur=null,cmSort='new';
const PID=i=>String(i.gid||i.url).replace(/[/.#$[]]/g,'_').slice(0,500);
const ago=t=>{if(!t)return '방금';const s=(Date.now()-t.toMillis())/1000;return s<60?'방금':s<3600?Math.floor(s/60)+'분 전':s<86400?Math.floor(s/3600)+'시간 전':s<2592000?Math.floor(s/86400)+'일 전':t.toDate().toLocaleDateString('ko-KR')};
async function loadCm(i){
 cur={pid:PID(i),stars:{},list:[]};const pid=cur.pid;
 if(!window.FB){setTimeout(()=>cur&&cur.pid===pid&&loadCm(i),500);return}
 try{const [s,l]=await Promise.all([FB.getStars(pid),FB.comments(pid)]);if(!cur||cur.pid!==pid)return;cur.stars=s;cur.list=l;drawCm()}
 catch(e){console.error('커뮤니티 불러오기 실패',e);const el=$('cm');if(el)el.innerHTML='<small style="color:var(--mute)">평점·댓글을 불러오지 못했습니다.</small>'}
}
function drawCm(){
 const el=$('cm');if(!el||!cur)return;const me=user&&FB.uid();
 const v=Object.values(cur.stars),avg=v.length?(v.reduce((a,b)=>a+b,0)/v.length):0,mine=me?cur.stars[me]||0:0;
 const sc=c=>Object.keys(c.up||{}).length-Object.keys(c.down||{}).length;
 const list=[...cur.list].sort((a,b)=>cmSort==='best'?sc(b)-sc(a):0);
 el.innerHTML=`<h3>이 패치 어땠나요?</h3><div class="rate"><span class="avg">${v.length?'★ '+avg.toFixed(1):'☆ -'}</span><small>${v.length}명 평가</small>
  <span class="stars" title="${me?'내 별점':'로그인하면 별점을 줄 수 있습니다'}">${[1,2,3,4,5].map(n=>`<button data-rate="${n}" class="${n<=mine?'on':''}">★</button>`).join('')}</span>${mine?'<small>내 별점 '+mine+'점</small>':''}</div>
  <h3>댓글 ${cur.list.length}</h3>
  <div class="cmf"><textarea id="cmTxt" maxlength="1000" placeholder="${me?'이 패치에 대한 생각을 남겨 주세요':'로그인하면 댓글을 쓸 수 있습니다'}"></textarea><button data-post>등록</button></div>
  ${cur.list.length>1?`<div class="cmsort"><button data-sort="new" class="${cmSort==='new'?'on':''}">최신순</button><button data-sort="best" class="${cmSort==='best'?'on':''}">추천순</button></div>`:''}
  ${list.map(c=>{const u=me&&c.up&&c.up[me],d=me&&c.down&&c.down[me],st=cur.stars[c.uid];
   return `<div class="cmi"><div class="h"><b>${esc(c.name||'사용자')}</b>${st?'<span class="st">'+'★'.repeat(st)+'</span>':''}<span>${ago(c.ts)}</span>${me===c.uid?`<button class="del" data-del="${c.id}">삭제</button>`:''}</div>
   <p>${esc(c.text)}</p><div class="v"><button class="u${u?' on':''}" data-vote="${c.id}" data-v="1">👍 ${Object.keys(c.up||{}).length}</button><button class="d${d?' on':''}" data-vote="${c.id}" data-v="-1">👎 ${Object.keys(c.down||{}).length}</button></div></div>`}).join('')||'<small style="color:var(--mute)">첫 댓글을 남겨 보세요.</small>'}`;
}
function cmErr(m){console.error(m);const el=$('cm');if(!el)return;let t=el.querySelector('.cmerr');if(!t){t=document.createElement('small');t.className='cmerr';t.style.cssText='color:var(--down);display:block;margin-bottom:8px';el.prepend(t)}t.textContent=m;clearTimeout(t._h);t._h=setTimeout(()=>t.remove(),3000)}
function needLogin(){if(user)return false;closeDlg();alertLogin();return true}
$('body').addEventListener('click',async e=>{
 if(!cur)return;const pid=cur.pid,me=user&&FB.uid();
 const r=e.target.closest('[data-rate]');if(r){if(needLogin())return;let n=+r.dataset.rate;if(cur.stars[me]===n){n=0;delete cur.stars[me]}else cur.stars[me]=n;drawCm();FB.rate(pid,n).catch(async er=>{console.error(er);try{cur.stars=await FB.getStars(pid)}catch(_){}drawCm();cmErr('별점을 저장하지 못했습니다.')});return}
 const s=e.target.closest('[data-sort]');if(s){cmSort=s.dataset.sort;drawCm();return}
 if(e.target.closest('[data-post]')){if(needLogin())return;const t=$('cmTxt').value.trim();if(!t)return;e.target.disabled=true;
  try{await FB.addComment(pid,t);cur.list=await FB.comments(pid);drawCm()}catch(er){console.error(er);e.target.disabled=false;cmErr('댓글을 등록하지 못했습니다.')}return}
 const d=e.target.closest('[data-del]');if(d){try{await FB.delComment(pid,d.dataset.del);cur.list=cur.list.filter(c=>c.id!==d.dataset.del);drawCm()}catch(er){console.error(er);cmErr('삭제하지 못했습니다.')}return}
 const vb=e.target.closest('[data-vote]');if(vb){if(needLogin())return;const c=cur.list.find(x=>x.id===vb.dataset.vote);if(!c)return;
  const want=+vb.dataset.v,now=c.up&&c.up[me]?1:c.down&&c.down[me]?-1:0,v=now===want?0:want;
  c.up={...c.up};c.down={...c.down};delete c.up[me];delete c.down[me];if(v===1)c.up[me]=true;if(v===-1)c.down[me]=true;drawCm();
  FB.vote(pid,c.id,v).catch(async er=>{console.error(er);try{cur.list=await FB.comments(pid)}catch(_){}drawCm();cmErr('투표를 저장하지 못했습니다.')})}
});

 items=d.items.sort((a,b)=>b.date-a.date); ICONS=d.icons||{};
 items.forEach(i=>{i._d=new Date(i.date*1000).toLocaleDateString('sv');i._k=dayKey(i.date);i._s=[i.game,i.title,i.origTitle,i.summary,...(i.highlights||[]),...(i.buffs||[]),...(i.nerfs||[]),...(i.fixes||[])].join(' ').toLowerCase()});
 $('upd').textContent='마지막 갱신 '+new Date(d.updated).toLocaleString('ko-KR');

 drawUser();render();
});

{let t;$('q').oninput=()=>{clearTimeout(t);t=setTimeout(render,200)}};$('g').onchange=render;$('onlyFav').onchange=render;

$('body').onclick=e=>{const al=e.target.closest('[data-all]');if(al){$('q').value='';$('day').value='';$('onlyFav').checked=false;setGame(al.dataset.all);render();closeDlg();scrollTo(0,0);return}const b=e.target.closest('[data-fav]');if(!b)return;if(toggleFav(b.dataset.fav)){const on=favs.has(b.dataset.fav);b.classList.toggle('on',on);b.textContent=on?'★ 즐겨찾는 게임':'☆ 게임 즐겨찾기'}};
$('favs').onclick=e=>{const r=e.target.closest('[data-rm]');if(r){favs.delete(r.dataset.rm);saveFavs();drawUser();render();return}
 const f=e.target.closest('[data-g]');if(f){setGame(f.dataset.g);render();closeDrawer();scrollTo(0,0)}};
</script>
